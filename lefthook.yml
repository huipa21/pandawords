no_auto_install: true

# Environment-backed scripts avoid Git for Windows stripping quotes from node -e arguments.
pre-commit:
  piped: true
  jobs:
    - name: environment-files
      env:
        PW_ENV_GUARD: |
          const { execFileSync } = require('node:child_process')
          const files = execFileSync('git', [
            'diff', '--cached', '--name-only', '--no-renames', '--diff-filter=ACMT', '-z', '--',
          ], { maxBuffer: 1024 * 1024 * 1024 }).toString('utf8').split('\0').filter(Boolean)
          const blocked = files.filter(file => {
            const parts = file.split('/')
            return parts.some((part, index) =>
              /^\.env/i.test(part) && !(index === parts.length - 1 && part === '.env.example'))
          })
          if (blocked.length) {
            console.error('Blocked staged environment files; only .env.example is allowed:')
            for (const file of blocked) console.error('  ' + JSON.stringify(file))
            process.exitCode = 1
          }
      run: node -e eval\(process.env.PW_ENV_GUARD\)
    - name: ruff-format
      env:
        PW_LINTER: ruff-format
        PW_LINT_STAGED: &lint-staged |
          const path = require('node:path')
          const { spawnSync } = require('node:child_process')
          const root = process.cwd()
          // Read the index directly so partial staging and shell-sensitive paths are handled safely.
          const index = spawnSync('git', [
            'diff', '--cached', '--name-only', '--no-renames', '--diff-filter=ACMT', '-z', '--',
          ], { cwd: root, maxBuffer: 1024 * 1024 * 1024 })
          if (index.error) throw index.error
          if (index.status !== 0) throw new Error('Could not list staged files: ' + index.stderr)
          const files = index.stdout.toString('utf8').split('\0').filter(file =>
            process.env.PW_LINTER === 'eslint' ? /\.(ts|vue)$/.test(file) : file.endsWith('.py'))

          function staged(file) {
            const result = spawnSync('git', ['show', ':' + file], {
              cwd: root,
              maxBuffer: 1024 * 1024 * 1024,
            })
            if (result.error) throw result.error
            if (result.status !== 0) {
              throw new Error('Could not read staged ' + JSON.stringify(file) + ': ' + result.stderr)
            }
            return result.stdout
          }

          async function main() {
            if (!files.length) return
            if (process.env.PW_LINTER === 'eslint') {
              const { ESLint } = require('./frontend/node_modules/eslint')
              // Antfu detects its optional Vue and TypeScript plugins from the frontend directory.
              process.chdir(path.join(root, 'frontend'))
              const eslint = new ESLint({
                cwd: root,
                overrideConfigFile: path.join(root, 'frontend', 'eslint.config.mjs'),
                ignore: false,
              })
              const results = []
              for (const file of files) {
                results.push(...await eslint.lintText(staged(file).toString('utf8'), {
                  filePath: path.join(root, file),
                  warnIgnored: true,
                }))
              }
              const formatter = await eslint.loadFormatter('stylish')
              process.stdout.write(formatter.format(results))
              if (results.length !== files.length || results.some(result =>
                result.errorCount > 0 || result.messages.some(message =>
                  message.ruleId === null && message.message.startsWith('File ignored')))) {
                process.exitCode = 1
              }
              return
            }

            const mode = process.env.PW_LINTER
            if (mode !== 'ruff-format' && mode !== 'ruff-check') {
              throw new Error('Unknown linter: ' + mode)
            }
            const command = mode === 'ruff-format' ? ['format', '--check'] : ['check']
            for (const file of files) {
              const result = spawnSync('uv', [
                'run', '--offline', '--no-sync', '--locked', '--project', 'backend',
                'ruff', ...command, '--config', 'backend/pyproject.toml', '--stdin-filename', file, '-',
              ], { cwd: root, input: staged(file), stdio: ['pipe', 'inherit', 'inherit'] })
              if (result.error) throw result.error
              if (result.status !== 0) {
                console.error(mode + ' failed for ' + JSON.stringify(file))
                process.exitCode = 1
              }
            }
          }
          main().catch(error => {
            console.error(error)
            process.exitCode = 1
          })
      run: node -e eval\(process.env.PW_LINT_STAGED\)
    - name: ruff-check
      env:
        PW_LINTER: ruff-check
        PW_LINT_STAGED: *lint-staged
      run: node -e eval\(process.env.PW_LINT_STAGED\)
    - name: eslint
      env:
        PW_LINTER: eslint
        PW_LINT_STAGED: *lint-staged
      run: node -e eval\(process.env.PW_LINT_STAGED\)
