services:
  web:
    image: pandawords-web:${APP_VERSION:?Set APP_VERSION in .env}
    restart: unless-stopped
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 64m
    volumes:
      - media:/data/media:ro
    networks:
      internal:
      caddy:
        aliases:
          - pandawords-web
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    image: pandawords-api:${APP_VERSION:?Set APP_VERSION in .env}
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      SURREAL_URL: ws://surrealdb:8000/rpc
      MEDIA_DIR: /data/media
      LEXICON_DIR: /data/lexicon
    depends_on:
      migrate:
        condition: service_completed_successfully
      surrealdb:
        condition: service_healthy
    mem_limit: 768m
    volumes:
      - media:/data/media
      - ./lexicon:/data/lexicon:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/readyz', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    image: pandawords-api:${APP_VERSION:?Set APP_VERSION in .env}
    restart: "no"
    env_file: .env
    environment:
      APP_ENV: production
      SURREAL_URL: ws://surrealdb:8000/rpc
    command: ["python", "-m", "app.db.backup", "--backup-dir", "/backups"]
    # Only the one-shot writes the root-owned backup volume; the API stays non-root.
    user: "0:0"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    depends_on:
      surrealdb:
        condition: service_healthy
    volumes:
      - backups:/backups
    networks:
      - internal

  surrealdb:
    image: docker.io/surrealdb/surrealdb:v3.3.5
    restart: unless-stopped
    env_file: .env
    command: start --no-banner --log warn rocksdb:/data/pandawords.db
    # The upstream image has no writable /data to initialize a named volume from.
    user: "0:0"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    volumes:
      - database:/data
    tmpfs:
      - /logs
    networks:
      - internal
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "ws://127.0.0.1:8000"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  database:
  media:
  backups:

networks:
  internal:
    internal: true
  caddy:
    external: true
    name: ${CADDY_NETWORK:?Set CADDY_NETWORK in .env}
